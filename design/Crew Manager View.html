<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design_doc_mode" content="canvas" />
<title>운영진 화면 — 권한별 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body { margin: 0; font-family: 'Pretendard', -apple-system, system-ui, sans-serif; }
  .phone { width: 390px; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 40px 80px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.10); }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; border-radius: 22px; background: #000; z-index: 50; }
  .caption { position: absolute; font-family: 'Pretendard', system-ui; font-size: 15px; font-weight: 600; color: #4A4D52; letter-spacing: -0.3px; }
  .sub { font-size: 13px; font-weight: 500; color: #8A8D93; margin-top: 2px; }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#74E827"/><g fill="#0D1A06"><circle cx="50" cy="38" r="14"/><path d="M24 78c0-14 12-22 26-22s26 8 26 22z"/><path d="M68 30l3 3 7-8" stroke="#0D1A06" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
</template>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const C = {
  bg: '#FAFAF7', surface: '#FFFFFF', surfaceAlt: '#F4F4EF',
  text: '#16171A', sub: '#6B6E74', faint: '#A2A6AC',
  border: '#E7E7E0', fieldBorder: '#E4E4DC',
  accent: '#74E827', accentText: '#0D1A06', accentDim: '#EAF8DA', grn: '#3C7A14',
  danger: '#D8463C',
  shadow: '0 1px 2px rgba(20,22,18,0.04), 0 8px 24px rgba(20,22,18,0.05)',
};
const F = "'Pretendard', -apple-system, system-ui, sans-serif";

function Icon({ d, size = 20, color, sw = 1.9, fill = 'none', children }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{children || <path d={d} />}</svg>;
}
const I = {
  back: (c) => <Icon size={20} color={c} sw={2.2} d="M15 5l-7 7 7 7" />,
  users: (c, s=13) => <Icon size={s} color={c} sw={2}><circle cx="9" cy="8.5" r="3.1" /><path d="M3.5 19.5c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8" /><path d="M16 5.4a3 3 0 010 6M18.5 19.5c0-2.4-1-4-2.6-4.8" /></Icon>,
  bell: (c) => <Icon size={19} color={c} d="M6 9a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6zM9.5 20a2.5 2.5 0 005 0" />,
  trophy: (c) => <Icon size={19} color={c}><path d="M7 4h10v4a5 5 0 01-10 0V4z" /><path d="M7 5.5H4.5V7A2.5 2.5 0 007 9.5M17 5.5h2.5V7A2.5 2.5 0 0117 9.5M9.5 13.5h5M12 13v3M8.5 20h7" /></Icon>,
  plus: (c) => <Icon size={19} color={c} sw={2.4} d="M12 5v14M5 12h14" />,
  gear: (c) => <Icon size={19} color={c}><circle cx="12" cy="12" r="3.2" /><path d="M12 2.6l1.4 2.2 2.6-.5.6 2.6 2.4 1-1 2.4 1 2.4-2.4 1-.6 2.6-2.6-.5L12 21.4l-1.4-2.2-2.6.5-.6-2.6-2.4-1 1-2.4-1-2.4 2.4-1 .6-2.6 2.6.5z" /></Icon>,
  shield: (c) => <Icon size={13} color={c} sw={2}><path d="M12 3l7 2.5v5.5c0 4.6-3 7.8-7 9-4-1.2-7-4.4-7-9V5.5z" /></Icon>,
  runner: (c) => <Icon size={20} color={c} sw={2.2}><circle cx="14.5" cy="4.6" r="1.9" /><path d="M13 8l-3 2 1 4-3 5M13 8l3 1 3-1M13 8l-1 3 3 2 1 4" /></Icon>,
  lock: (c) => <Icon size={13} color={c} sw={2}><rect x="4.5" y="10.5" width="15" height="10" rx="2.2" /><path d="M8 10.5V8a4 4 0 018 0v2.5" /></Icon>,
};

// avatar
function Avatar({ name, size = 38, ring }) {
  const hue = [...name].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 360;
  return <div style={{ width: size, height: size, borderRadius: 999, flexShrink: 0, background: `hsl(${hue} 45% 62%)`, border: ring ? `2px solid ${ring}` : 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontFamily: F, fontWeight: 700, fontSize: size * 0.4 }}>{name[0]}</div>;
}

// generated neon route on dark map
function RouteMap({ seed, h = 210 }) {
  let s = [...seed].reduce((a, ch) => a + ch.charCodeAt(0), 0);
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  let d = `M ${20 + rnd() * 40} ${40 + rnd() * 120}`;
  for (let i = 0; i < 6; i++) d += ` L ${30 + rnd() * 320} ${30 + rnd() * 150}`;
  return (
    <svg width="100%" height={h} viewBox={`0 0 390 ${h}`} preserveAspectRatio="xMidYMid slice" style={{ display: 'block' }}>
      <rect width="390" height={h} fill="#0C1206" />
      {[...Array(7)].map((_, i) => <line key={'h'+i} x1="0" y1={i*30} x2="390" y2={i*30} stroke="#1a2410" strokeWidth="1" />)}
      {[...Array(13)].map((_, i) => <line key={'v'+i} x1={i*30} y1="0" x2={i*30} y2={h} stroke="#1a2410" strokeWidth="1" />)}
      <path d={d} fill="none" stroke="#7CF03D" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" opacity="0.92" />
    </svg>
  );
}

function ManageBtn({ icon, label }) {
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: '12px 4px', boxShadow: C.shadow }}>
      {I[icon](C.grn)}
      <span style={{ fontFamily: F, fontSize: 12, fontWeight: 700, color: C.text, letterSpacing: -0.2, whiteSpace: 'nowrap' }}>{label}</span>
    </div>
  );
}

// the crew screen as a granted manager sees it
function ManagerCrewView({ perms }) {
  const acts = [
    perms.notice && ['bell', '공지 올리기'],
    perms.challenge && ['trophy', '챌린지 생성'],
    perms.invite && ['plus', '멤버 초대'],
    perms.editInfo && ['gear', '크루 편집'],
  ].filter(Boolean);
  const ch = { title: '6월 한강 100K', done: 62.4, goal: 100, days: 12 };
  const pct = Math.round((ch.done / ch.goal) * 100);
  const ranking = [['민준', 18.2], ['지윤', 14.6], ['서연', 12.0], ['도현', 9.4]];
  return (
    <div style={{ width: 390, height: 844, background: C.bg, overflow: 'hidden', position: 'relative', fontFamily: F }}>
      {/* dark header band */}
      <div style={{ position: 'relative', background: '#0C1206' }}>
        <div style={{ position: 'absolute', inset: 0, opacity: 0.5 }}><RouteMap seed={'mgr' + acts.length} /></div>
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(8,12,4,0.55), rgba(8,12,4,0.92))' }} />
        <div style={{ position: 'relative', padding: '54px 16px 20px' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <span style={{ width: 40, height: 40, borderRadius: 999, background: 'rgba(255,255,255,0.14)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{I.back('#fff')}</span>
            {/* no 크루 관리 button — owner only */}
          </div>
          <h1 style={{ fontFamily: F, fontSize: 24, fontWeight: 700, color: '#fff', letterSpacing: -0.6, margin: '16px 0 0' }}>성수 새벽 크루</h1>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 8 }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 3, fontFamily: F, fontSize: 10.5, fontWeight: 800, color: '#0D1A06', background: '#7CF03D', borderRadius: 6, padding: '2px 7px' }}>운영진</span>
            {I.users('rgba(255,255,255,0.7)')}
            <span style={{ fontFamily: F, fontSize: 13, color: 'rgba(255,255,255,0.78)' }}>54명 · 성수동 서울숲</span>
          </div>
          <p style={{ fontFamily: F, fontSize: 13.5, lineHeight: 1.5, color: 'rgba(255,255,255,0.88)', margin: '12px 0 0' }}>매주 화·목 새벽 6시, 서울숲에서 함께 달려요.</p>
        </div>
      </div>

      {/* permission-scoped manage bar */}
      {acts.length > 0 ? (
        <div style={{ display: 'flex', gap: 9, padding: '16px 20px 0' }}>
          {acts.map(([ic, lbl]) => <ManageBtn key={lbl} icon={ic} label={lbl} />)}
        </div>
      ) : (
        <div style={{ padding: '16px 20px 0' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 9, background: C.surfaceAlt, border: `1px dashed ${C.fieldBorder}`, borderRadius: 14, padding: '13px 15px' }}>
            {I.lock(C.faint)}
            <span style={{ fontFamily: F, fontSize: 12.5, color: C.faint, fontWeight: 600, letterSpacing: -0.2 }}>부여된 관리 권한이 없어요 · 보기 전용</span>
          </div>
        </div>
      )}

      {/* active challenge hero */}
      <div style={{ padding: '20px 20px 0' }}>
        <div style={{ position: 'relative', overflow: 'hidden', background: '#0C1206', borderRadius: 20, padding: 18 }}>
          <div style={{ position: 'absolute', top: -30, right: -30, width: 120, height: 120, borderRadius: 999, background: '#7CF03D', opacity: 0.14 }} />
          <div style={{ position: 'relative' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ fontFamily: F, fontSize: 12, fontWeight: 700, color: '#EAFBDD', letterSpacing: 0.2 }}>진행 중인 챌린지</span>
              <span style={{ fontFamily: F, fontSize: 11.5, fontWeight: 800, color: '#0D1A06', background: '#7CF03D', borderRadius: 8, padding: '4px 9px' }}>D-{ch.days}</span>
            </div>
            <div style={{ fontFamily: F, fontSize: 18, fontWeight: 700, color: '#fff', letterSpacing: -0.4, marginTop: 10 }}>{ch.title}</div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginTop: 10 }}>
              <span style={{ fontFamily: F, fontSize: 26, fontWeight: 700, color: '#7CF03D', letterSpacing: -1 }}>{ch.done}</span>
              <span style={{ fontFamily: F, fontSize: 13, color: 'rgba(255,255,255,0.6)' }}>/ {ch.goal}km</span>
              <span style={{ marginLeft: 'auto', fontFamily: F, fontSize: 13, fontWeight: 700, color: '#7CF03D' }}>{pct}%</span>
            </div>
            <div style={{ height: 7, borderRadius: 99, background: 'rgba(255,255,255,0.16)', marginTop: 9, overflow: 'hidden' }}>
              <div style={{ height: '100%', width: pct + '%', background: '#7CF03D', borderRadius: 99 }} />
            </div>
          </div>
        </div>
      </div>

      {/* crew run — only with permission */}
      {perms.crewRun ? (
        <div style={{ padding: '14px 20px 0' }}>
          <div style={{ height: 54, borderRadius: 16, background: C.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, boxShadow: `0 6px 18px ${C.accent}55` }}>
            {I.runner(C.accentText)}
            <span style={{ fontFamily: F, fontSize: 15.5, fontWeight: 700, color: C.accentText, letterSpacing: -0.3 }}>크루 러닝 시작</span>
          </div>
        </div>
      ) : null}

      {/* ranking */}
      <div style={{ padding: '22px 20px 0' }}>
        <div style={{ fontFamily: F, fontSize: 17, fontWeight: 700, color: C.text, letterSpacing: -0.4, marginBottom: 12 }}>크루 랭킹</div>
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 18, padding: '6px 12px', boxShadow: C.shadow }}>
          {ranking.map(([nm, km], i) => {
            const me = nm === '지윤';
            return (
              <div key={nm} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 6px', borderRadius: 12, background: me ? C.accentDim : 'transparent' }}>
                <span style={{ fontFamily: F, fontSize: 14, fontWeight: 800, color: i < 3 ? C.grn : C.faint, width: 18 }}>{i + 1}</span>
                <Avatar name={nm} size={36} ring={me ? C.accent : C.border} />
                <span style={{ flex: 1, fontFamily: F, fontSize: 14.5, fontWeight: me ? 700 : 600, color: C.text, letterSpacing: -0.3 }}>{nm}{me && <span style={{ fontFamily: F, fontSize: 10, fontWeight: 800, color: C.accentText, background: C.accent, borderRadius: 5, padding: '1px 5px', marginLeft: 6 }}>나</span>}</span>
                <span style={{ fontFamily: F, fontSize: 14, fontWeight: 700, color: me ? C.grn : C.sub }}>{km}<span style={{ fontSize: 10, color: C.faint }}> km</span></span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Frame({ x, y, title, sub, perms }) {
  return (
    <div style={{ position: 'absolute', left: x, top: y }}>
      <div className="caption" style={{ top: -52, left: 4 }}>{title}<div className="sub">{sub}</div></div>
      <div className="phone">
        <div className="island"></div>
        <ManagerCrewView perms={perms} />
      </div>
    </div>
  );
}

function App() {
  return (
    <>
      <div style={{ position: 'absolute', top: 56, left: 60, fontFamily: F }}>
        <div style={{ fontSize: 30, fontWeight: 800, color: '#1A1C20', letterSpacing: -0.8 }}>운영진 화면 — 권한별 미리보기</div>
        <div style={{ fontSize: 15, color: '#6B6E74', marginTop: 8, maxWidth: 760, lineHeight: 1.5 }}>크루장이 부여한 권한에 따라, 운영진에게 보이는 크루 화면이 달라져요. 관리 바·크루 러닝 버튼·공지 작성 권한이 권한 설정에 맞춰 나타나거나 사라집니다. (크루 관리 버튼은 크루장 전용이라 운영진에게는 보이지 않아요.)</div>
      </div>
      <Frame x={60} y={200} title="전체 권한 운영진" sub="공지·챌린지·초대·편집 + 크루 러닝 모두 허용" perms={{ notice: true, challenge: true, invite: true, editInfo: true, crewRun: true }} />
      <Frame x={530} y={200} title="제한된 권한 운영진" sub="공지·챌린지만 허용 · 크루 러닝 비허용" perms={{ notice: true, challenge: true, invite: false, editInfo: false, crewRun: false }} />
      <Frame x={1000} y={200} title="보기 전용 운영진" sub="관리 권한 없음 · 일반 크루원과 동일하게 열람" perms={{ notice: false, challenge: false, invite: false, editInfo: false, crewRun: false }} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
