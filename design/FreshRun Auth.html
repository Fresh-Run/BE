<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FreshRun — 인증 &amp; 온보딩</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #EDEDE8;
    min-height: 100vh;
    font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
  }
  #root { min-height: 100vh; }
  input::placeholder { color: #ABAFB5; }

  /* Entrances are transform-only (never hide content) so a frozen-timeline
     snapshot still shows everything; resting state is the visible end-state. */
  @keyframes frspin { to { transform: rotate(360deg); } }
  @keyframes frpulse {
    0% { transform: scale(0.8); opacity: 0.5; }
    70% { transform: scale(1.9); opacity: 0; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  @keyframes frpop { from { transform: scale(0.6); } to { transform: scale(1); } }
  @keyframes frshake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  @keyframes frfadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes frsheetup { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes frbubble { from { transform: scale(0.96) translateY(-6px); } to { transform: none; } }
  @keyframes frInR { from { transform: translateX(14px); } to { transform: none; } }
  @keyframes frInL { from { transform: translateX(-14px); } to { transform: none; } }
  .fr-screen { animation-duration: .34s; animation-timing-function: cubic-bezier(.22,.61,.36,1); }

  /* course flow */
  @keyframes frcdraw { to { stroke-dashoffset: 0; } }
  @keyframes frshim { to { background-position: -200% 0; } }
  @keyframes frblink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .frdots::after { content: ''; animation: frdots 1.4s steps(4,end) infinite; }
  @keyframes frdots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  @media (prefers-reduced-motion: reduce) {
    .fr-screen, [style*="frpulse"], [style*="frpop"], [style*="frshim"], [style*="frblink"], [style*="frcdraw"] { animation: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="auth-ui.jsx"></script>
<script type="text/babel" src="auth-screens.jsx"></script>
<script type="text/babel" src="home-ui.jsx"></script>
<script type="text/babel" src="home-cards.jsx"></script>
<script type="text/babel" src="home-screens.jsx"></script>
<script type="text/babel" src="community-screen.jsx"></script>
<script type="text/babel" src="course-ui.jsx"></script>
<script type="text/babel" src="course-form.jsx"></script>
<script type="text/babel" src="course-flow.jsx"></script>
<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel" src="auth-app.jsx"></script>
</body>
</html>
