<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FreshRun — 이번 달 기록 옵션 (2차)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: #EDEDE8; font-family: 'Pretendard', sans-serif; padding: 34px 0 80px; }
  .wrap { width: 412px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 800; color: #16171A; letter-spacing: -0.6px; margin: 0 0 4px; }
  .sub { font-size: 13.5px; color: #6B6E74; margin: 0 0 24px; }
  .opt { margin-bottom: 26px; }
  .optlab { display:flex; align-items:baseline; gap:8px; margin: 0 4px 10px; }
  .optn { font-size: 13.5px; font-weight: 800; color:#16171A; }
  .optd { font-size: 12px; color:#8B8E94; }
  .stage { background:#FAFAF7; border:1px solid #ECECE5; border-radius:24px; padding:18px; box-shadow:0 1px 2px rgba(20,22,18,0.04),0 10px 30px rgba(20,22,18,0.06); }
  .recordsHdr { font-size:24px; font-weight:800; color:#16171A; letter-spacing:-0.7px; margin-bottom:16px; }
  .mstep { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .mstepb { width:34px;height:34px;border-radius:999px;border:1px solid #E7E7E0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer; }
  .mstept { font-size:16px; font-weight:800; color:#16171A; letter-spacing:-0.4px; }
  .delta { font-size:12.5px;font-weight:700;color:#3C7A14;background:#EAF8DA;border-radius:999px;padding:4px 10px; }
  .hero { font-size:40px;font-weight:800;letter-spacing:-1.6px;color:#16171A; }
  .heroU { font-size:16px;font-weight:700;color:#A2A6AC; }
  .slab { font-size:11px; font-weight:600; letter-spacing:0.2px; color:#A2A6AC; }
  .srow { display:flex; }
  .srowc { flex:1; text-align:center; padding:2px 0; }
  .srowc + .srowc { border-left:1px solid #E7E7E0; }
  .sv { font-size:18px;font-weight:800;letter-spacing:-0.4px;color:#16171A; }
  .sv .u { font-size:11px;color:#A2A6AC;font-weight:600; }
  .seg { display:flex; gap:3px; background:#F0F0EA; border-radius:999px; padding:3px; }
  .segb { flex:1; text-align:center; height:30px; line-height:30px; border-radius:999px; font-size:12.5px; font-weight:700; color:#7C7F86; cursor:pointer; }
  .segb.on { background:#fff; color:#16171A; box-shadow:0 1px 3px rgba(20,22,18,0.12); }
  svg { display:block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>"이번 달 기록" — 옵션 2 변형</h1>
  <p class="sub">옵션 2 방향(히어로 + 그래프 + 월 전환)을 발전시킨 4가지예요. 마음에 드는 번호를 알려주세요.</p>
  <div id="list"></div>
</div>
<script>
const ACCENT='#74E827', GRN='#3C7A14', TEXT='#16171A', FAINT='#A2A6AC', SUB='#6B6E74';
const WEEKS=[8.2,12.4,9.6,12.6], WL=['1주','2주','3주','4주'];
const STATS=[['총 거리','42.8','km'],['세션','12','회'],['평균 페이스',"5'18\"",''],['총 시간','3:47','h']];

function areaChart(vals,w,h,col,dots){
  const max=Math.max(...vals),min=Math.min(...vals),n=vals.length,pad=4;
  const pts=vals.map((v,i)=>[pad+i*((w-2*pad)/(n-1)), h-6-((v-min)/(max-min||1))*(h-18)]);
  let d=''; pts.forEach((p,i)=>{ if(i===0)d=`M ${p[0]} ${p[1]}`; else {const pr=pts[i-1],mx=(pr[0]+p[0])/2; d+=` C ${mx} ${pr[1]}, ${mx} ${p[1]}, ${p[0]} ${p[1]}`;}});
  const area=d+` L ${pts[n-1][0]} ${h} L ${pts[0][0]} ${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><defs><linearGradient id="g${col.replace('#','')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity="0.30"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#g${col.replace('#','')})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round"/>${dots?pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="${col}" stroke-width="2"/>`).join(''):''}</svg>`;
}
function barChart(vals,w,h,col,track,labels){
  const max=Math.max(...vals),n=vals.length,gap=w*0.05,bw=(w-gap*(n-1))/n; let s='';
  vals.forEach((v,i)=>{const bh=Math.max(6,(v/max)*(h-(labels?18:2))),x=i*(bw+gap),y=h-(labels?18:0)-bh;
    s+=`<rect x="${x.toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${(h-(labels?18:0)).toFixed(1)}" rx="${Math.min(7,bw/2)}" fill="${track}"/><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(7,bw/2)}" fill="${col}"/>`;
    if(labels)s+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-3}" text-anchor="middle" font-family="Pretendard" font-size="10" font-weight="600" fill="${FAINT}">${labels[i]}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${s}</svg>`;
}
function ring(pct,size,col){
  const r=(size-14)/2,cx=size/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><g transform="rotate(-90 ${cx} ${cx})"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#EDEDE6" stroke-width="9"/><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></g></svg>`;
}
function heatmap(){
  // 5 weeks x 7 days, fixed intensities 0-4
  const I=[2,0,3,1,4,2,0, 1,2,0,3,2,4,1, 0,3,2,1,0,2,3, 2,4,1,2,0,1,3, 3,1,2,0,2,4,1];
  const cols=['#EFEFE9','#D6F2B8','#AEE87C','#8EDD4F','#74E827'];
  const cell=15,gap=4; let s='';
  for(let c=0;c<5;c++)for(let r=0;r<7;r++){const i=I[c*7+r]; s+=`<rect x="${c*(cell+gap)}" y="${r*(cell+gap)}" width="${cell}" height="${cell}" rx="4" fill="${cols[i]}"/>`;}
  const w=5*(cell+gap)-gap,h=7*(cell+gap)-gap;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${s}</svg>`;
}
const ARROW=(c)=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`;
const ARROWR=(c)=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
const mstep=`<div class="mstep"><div class="mstepb">${ARROW('#16171A')}</div><div class="mstept">2024 · 6월</div><div class="mstepb">${ARROWR('#16171A')}</div></div>`;
const statRow=`<div class="srow">${STATS.map(s=>`<div class="srowc"><div class="sv">${s[1]}<span class="u">${s[2]?' '+s[2]:''}</span></div><div class="slab" style="margin-top:4px;">${s[0]}</div></div>`).join('')}</div>`;

const OPTS=[
  ['5 · 목표 링 + 히어로', '월간 목표 달성 링을 히어로 옆에 — 진행도 한눈에', `
    ${mstep}
    <div style="display:flex;align-items:center;gap:18px;">
      <div style="position:relative;flex-shrink:0;">${ring(71,96,ACCENT)}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;"><span style="font-size:18px;font-weight:800;color:#16171A;letter-spacing:-0.5px;">71%</span><span style="font-size:9.5px;color:#A2A6AC;font-weight:600;">목표</span></div></div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:baseline;gap:5px;"><span class="hero" style="font-size:34px;">42.8</span><span class="heroU">/ 60km</span></div>
        <div style="margin-top:6px;"><span class="delta">지난달 +12%</span></div>
        <div style="margin-top:10px;">${barChart(WEEKS,180,30,ACCENT,'#F0F0EA')}</div>
      </div>
    </div>
    <div style="height:1px;background:#E7E7E0;margin:16px 0;"></div>
    ${statRow}`],

  ['6 · 풀 배경 그래프', '면적 그래프가 카드 배경, 숫자는 위에 오버레이', `
    ${mstep}
    <div style="position:relative;border-radius:18px;overflow:hidden;background:#fff;border:1px solid #E7E7E0;padding:16px 16px 0;">
      <div style="position:relative;z-index:2;"><div style="display:flex;align-items:baseline;gap:5px;"><span class="hero">42.8</span><span class="heroU">km</span><span class="delta" style="margin-left:auto;">지난달 +12%</span></div><div class="slab" style="margin-top:2px;">이번 달 총 거리</div></div>
      <div style="margin:6px -16px -1px;position:relative;z-index:1;">${areaChart(WEEKS,380,96,GRN)}</div>
    </div>
    <div style="margin-top:14px;">${statRow}</div>`],

  ['7 · 메트릭 전환 그래프', '거리/페이스/시간 토글로 그래프 전환 — 히어로도 같이 바뀜', `
    ${mstep}
    <div style="display:flex;align-items:baseline;gap:5px;"><span class="hero">42.8</span><span class="heroU">km</span><span class="delta" style="margin-left:auto;">지난달 +12%</span></div>
    <div class="slab" style="margin-top:2px;margin-bottom:12px;">총 거리</div>
    <div style="background:#fff;border:1px solid #E7E7E0;border-radius:16px;padding:14px;">
      ${barChart(WEEKS,330,96,ACCENT,'#F0F0EA',WL)}
    </div>
    <div class="seg" style="margin-top:12px;">${['거리','페이스','시간','세션'].map((m,i)=>`<div class="segb ${i===0?'on':''}">${m}</div>`).join('')}</div>`],

  ['8 · 활동 히트맵', '일별 러닝 히트맵 — 꾸준함/연속성을 시각화', `
    ${mstep}
    <div style="display:flex;align-items:baseline;gap:5px;"><span class="hero">42.8</span><span class="heroU">km</span><span class="delta" style="margin-left:auto;">12일 활동 · 5일 연속🔥</span></div>
    <div class="slab" style="margin-top:2px;margin-bottom:14px;">이번 달 총 거리</div>
    <div style="background:#fff;border:1px solid #E7E7E0;border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;">
      ${heatmap()}
      <div style="flex:1;">
        <div class="slab">활동 일수</div><div class="sv" style="font-size:22px;">12<span class="u"> / 30일</span></div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:10px;"><span class="slab">적음</span>${['#EFEFE9','#D6F2B8','#AEE87C','#74E827'].map(c=>`<span style="width:11px;height:11px;border-radius:3px;background:${c};"></span>`).join('')}<span class="slab">많음</span></div>
      </div>
    </div>
    <div style="height:1px;background:#E7E7E0;margin:16px 0;"></div>
    ${statRow}`],
];

const list=document.getElementById('list');
OPTS.forEach(o=>{
  const el=document.createElement('div'); el.className='opt';
  el.innerHTML=`<div class="optlab"><span class="optn">${o[0]}</span><span class="optd">${o[1]}</span></div>
    <div class="stage"><div class="recordsHdr">기록</div>${o[2]}</div>`;
  list.appendChild(el);
});
</script>
</body>
</html>
