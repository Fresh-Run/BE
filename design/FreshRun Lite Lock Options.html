<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FreshRun — Lite 잠금 카드 옵션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: #EDEDE8; font-family: 'Pretendard', sans-serif; padding: 34px 0 70px; }
  .wrap { width: 412px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 800; color: #16171A; letter-spacing: -0.6px; margin: 0 0 4px; }
  .sub { font-size: 13.5px; color: #6B6E74; margin: 0 0 22px; }
  .opt { margin-bottom: 22px; }
  .optlab { display:flex; align-items:baseline; gap:8px; margin: 0 4px 9px; }
  .optn { font-size: 13.5px; font-weight: 800; color:#16171A; }
  .optd { font-size: 12px; color:#8B8E94; }
  .stage { background:#FAFAF7; border:1px solid #ECECE5; border-radius:22px; padding: 16px; box-shadow:0 1px 2px rgba(20,22,18,0.04),0 8px 24px rgba(20,22,18,0.05); }
  /* mini stat tiles (context) */
  .tiles { display:flex; gap:10px; }
  .tile { flex:1; background:#fff; border:1px solid #E7E7E0; border-radius:16px; padding:13px 14px; }
  .tlab { font-size:10.5px; font-weight:600; letter-spacing:0.3px; color:#A2A6AC; text-transform:uppercase; }
  .tval { font-size:22px; font-weight:800; letter-spacing:-1px; color:#16171A; margin-top:7px; }
  .tval.g { color:#3C7A14; }
  .green { color:#3C7A14; }
  /* lock primitives */
  .lockico { display:inline-flex; align-items:center; justify-content:center; }
  /* A: big (reference) */
  .big { position:relative; margin-top:13px; background:#fff; border:1.5px solid rgba(116,232,39,0.45); border-radius:20px; padding:18px; min-height:184px; overflow:hidden; }
  .bigblur { filter:blur(3px); opacity:0.5; }
  .ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; background:rgba(250,250,247,0.62); backdrop-filter:blur(6px); }
  .ovc { width:46px;height:46px;border-radius:999px;background:#74E827;display:flex;align-items:center;justify-content:center; box-shadow:0 6px 16px rgba(116,232,39,0.4); }
  /* shared compact row */
  .row { display:flex; align-items:center; gap:12px; margin-top:13px; border-radius:16px; cursor:pointer; }
  .ricon { width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .rtitle { font-size:14.5px; font-weight:700; color:#16171A; letter-spacing:-0.3px; }
  .rsub { font-size:12px; color:#A2A6AC; letter-spacing:-0.2px; margin-top:2px; }
  .pill { font-size:10px; font-weight:800; letter-spacing:0.3px; color:#3C7A14; background:#EAF8DA; border-radius:6px; padding:2px 6px; text-transform:uppercase; }
  svg{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lite — 잠금 카드 옵션</h1>
  <p class="sub">기록 화면의 "AI 월간 분석" 업셀. 0번이 현재(너무 큼), 1~4번이 콤팩트 대안이에요.</p>
  <div id="list"></div>
</div>
<script>
const LOCK=(c,s)=>`<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>`;
const SPARK=(c,s)=>`<svg width="${s||16}" height="${s||16}" viewBox="0 0 24 24" fill="${c}" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>`;
const CHEV=(c)=>`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;

const tiles = `<div class="tiles"><div class="tile"><div class="tlab">이번 달 거리</div><div class="tval g">42.8<span style="font-size:13px;color:#A2A6AC;"> km</span></div></div><div class="tile"><div class="tlab">세션</div><div class="tval">12<span style="font-size:13px;color:#A2A6AC;"> 회</span></div></div></div>`;

const OPTS = [
  ['0 · 현재 (참고)', '풀 카드에 블러+오버레이 — 너무 큼', `
    <div class="big">
      <div class="bigblur">
        <div style="display:flex;align-items:center;gap:7px;"><span style="width:22px;height:22px;border-radius:7px;background:#EAF8DA;display:flex;align-items:center;justify-content:center;">${SPARK('#3C7A14',13)}</span><span style="font-size:11.5px;font-weight:800;color:#3C7A14;letter-spacing:0.4px;">PREMIUM INSIGHT</span></div>
        <div style="display:flex;gap:6px;margin-top:16px;"><div style="flex:1;"><div style="font-size:18px;font-weight:800;color:#16171A;">42.8</div></div><div style="flex:1;"><div style="font-size:18px;font-weight:800;color:#16171A;">12</div></div><div style="flex:1;"><div style="font-size:18px;font-weight:800;color:#16171A;">5'18"</div></div></div>
        <div style="height:8px;border-radius:99px;background:#F4F4EF;margin-top:18px;"></div>
        <div style="height:34px;"></div>
      </div>
      <div class="ov"><div class="ovc">${LOCK('#0D1A06',22)}</div><div style="font-size:13.5px;font-weight:700;color:#16171A;">AI 월간 분석 · 프리미엄</div><div style="font-size:12.5px;font-weight:700;color:#3C7A14;">잠금 해제하기 ›</div></div>
    </div>`],

  ['1 · 한 줄 행', '아이콘 + 제목 + 자물쇠 + 화살표. 가장 가벼움', `
    <div class="row" style="background:#fff;border:1px solid #E7E7E0;padding:13px 15px;">
      <span class="ricon" style="background:#EAF8DA;">${SPARK('#3C7A14',19)}</span>
      <div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;gap:7px;"><span class="rtitle">AI 월간 분석</span><span class="pill">Premium</span></div><div class="rsub">지구력·페이스 추이를 분석해요</div></div>
      ${LOCK('#A2A6AC',17)}
    </div>`],

  ['2 · 라임 업셀 스트립', '연한 라임 배경 + "보기" 버튼', `
    <div class="row" style="background:#EAF8DA;border:1px solid rgba(116,232,39,0.4);padding:12px 13px;">
      <span class="ricon" style="background:#fff;">${LOCK('#3C7A14',19)}</span>
      <div style="flex:1;min-width:0;"><div class="rtitle">AI 월간 분석 잠금 해제</div><div class="rsub" style="color:#5C7A3C;">프리미엄으로 더 깊은 인사이트를</div></div>
      <span style="flex-shrink:0;height:34px;display:flex;align-items:center;padding:0 14px;border-radius:999px;background:#74E827;color:#0D1A06;font-size:13px;font-weight:800;">보기</span>
    </div>`],

  ['3 · 미니멀 텍스트 링크', '거의 안 띄게, 통계 아래 한 줄', `
    <div style="display:flex;align-items:center;gap:6px;margin-top:14px;padding:2px 4px;cursor:pointer;">
      ${SPARK('#3C7A14',14)}<span style="font-size:13px;font-weight:700;color:#3C7A14;letter-spacing:-0.2px;">AI 월간 분석은 프리미엄에서</span>${CHEV('#3C7A14')}
    </div>`],

  ['4 · 미니 티저 카드', '높이 절반. 한 줄 요약 + 자물쇠', `
    <div class="row" style="background:#fff;border:1.5px solid rgba(116,232,39,0.4);padding:14px 15px;">
      <span class="ricon" style="background:linear-gradient(135deg,#74E827,#74E827aa);">${SPARK('#0D1A06',19)}</span>
      <div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;gap:7px;"><span class="rtitle">월간 AI 인사이트</span><span class="pill">Premium</span></div><div class="rsub">이번 달 지구력 12%↑ · 자세히 보려면 잠금 해제</div></div>
      ${LOCK('#A2A6AC',17)}
    </div>`],
];

const list=document.getElementById('list');
OPTS.forEach(o=>{
  const el=document.createElement('div'); el.className='opt';
  el.innerHTML=`<div class="optlab"><span class="optn">${o[0]}</span><span class="optd">${o[1]}</span></div>
  <div class="stage">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;"><span style="font-size:17px;font-weight:800;color:#16171A;letter-spacing:-0.4px;">기록</span></div>
    ${tiles}
    ${o[2]}
  </div>`;
  list.appendChild(el);
});
</script>
</body>
</html>
